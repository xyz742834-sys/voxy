// Only this development run includes the automation mod; it is never packaged.
sourceSets {
    harness {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runHarnessClient' }) {
        mods {
            voxy { sourceSet sourceSets.main }
            voxy_harness { sourceSet sourceSets.harness }
        }
    }
    runs {
        harnessClient {
            client()
            source sourceSets.harness
            runDir project.relativePath(project.findProperty('harnessRunDir') ?: 'build/harness/manual/game')
            vmArg '-Dvoxy.harness=true'
            if (project.hasProperty('harnessNative')) {
                vmArg '-Dvoxy.harness.native=true'
                environmentVariable 'VK_INSTANCE_LAYERS', 'VK_LAYER_KHRONOS_validation'
                environmentVariable 'VK_LAYER_VALIDATE_SYNC', '1'
                environmentVariable 'VK_LOADER_DEBUG', 'layer'
            }
            vmArg '-Dvoxy.5c4=on'
            vmArg '-Dvoxy.5c4.depth=4'
            vmArg '-Dvoxy.5c4.radius=0'
            vmArg '-Dvoxy.5c4.interval=120'
            vmArg '-Dvoxy.5c4.clearsweep=false'
            vmArg '-Dvoxy.harness.output=' + file(project.findProperty('harnessOutput') ?: 'build/harness/manual').absolutePath
            vmArg '-Dvoxy.harness.seconds=' + (project.findProperty('harnessSeconds') ?: '10')
            if (project.hasProperty('vkLibname')) {
                vmArg '-Dorg.lwjgl.vulkan.libname=' + project.property('vkLibname')
            }
            vmArg '-Dvoxy.vk.validation=true'
            // Minecraft's own launch argument wins over options.txt's preferredGraphicsBackend
            // ("Graphics backend forced to {} by launch argument, in-game preferred graphics backend
            // setting is ignored"), so forcing the backend here is the only reliable way to ask for
            // Minecraft's native Vulkan backend. --vulkanValidation is Minecraft's own flag for it.
            // The bounded native marker draw is off unless asked for; it must never appear
            // in a normal game. docs/ai/vulkan-native-integration-survey.md
            // The native diagnostics probe is opt-in too: round-1 review B2 found it ran
            // unconditionally, which broke the promise that nothing native runs without a flag.
            if (project.hasProperty('harnessNativeProbe')) {
                vmArg '-Dvoxy.native.probe=true'
            }
            if (project.hasProperty('harnessNativeMarker')) {
                vmArg '-Dvoxy.native.marker=true'
            }
            // Ask Minecraft's device for the features Voxy's shaders need. Off by default:
            // this changes Minecraft's own device creation. docs/ai/vulkan-native-integration-survey.md
            if (project.hasProperty('harnessNativeFeatures')) {
                vmArg '-Dvoxy.native.features=true'
            }
            // Adopt Minecraft's device into Voxy's VkContext. Off by default; Voxy's renderer
            // stays disabled either way until the GL-free renderer path exists.
            if (project.hasProperty('harnessNativeAdopt')) {
                vmArg '-Dvoxy.native.adopt=true'
            }
            // Record Voxy's REAL terrain pipeline into Minecraft's own Vulkan frame.
            // Off by default and it must stay that way: when enabled it clears Minecraft's
            // colour and depth so the frame can be compared pixel-for-pixel against the same
            // scene drawn to Voxy's own target. Experimental — round 4 permits terrain
            // investigation but not promotion. docs/ai/vulkan-native-integration-survey.md
            if (project.hasProperty('harnessNativeTerrain')) {
                vmArg '-Dvoxy.native.terrain=true'
            }
            // Read Minecraft's own scene depth back and measure its convention. Read-only:
            // it writes nothing to Minecraft's images. Off by default like everything native.
            if (project.hasProperty('harnessNativeDepth')) {
                vmArg '-Dvoxy.native.depth=true'
            }
            // Test a ladder of known depths against Minecraft's OWN loaded scene depth, with
            // depth writes disabled. This is how the Z convention has to be approached: the
            // buffer-copy route returns all zeros. Off by default like everything native.
            if (project.hasProperty('harnessNativeDepthLadder')) {
                vmArg '-Dvoxy.native.depthladder=true'
            }
            if (project.hasProperty('harnessGraphicsBackend')) {
                programArg '--graphicsBackend'
                programArg project.property('harnessGraphicsBackend')
                if (project.property('harnessGraphicsBackend') == 'vulkan') {
                    programArg '--vulkanValidation'
                }
            }
            def layerRoot = '/opt/homebrew/opt/vulkan-validationlayers'
            if (file("$layerRoot/share/vulkan/explicit_layer.d").exists()) {
                environmentVariable 'VK_LAYER_PATH', "$layerRoot/share/vulkan/explicit_layer.d"
                environmentVariable 'DYLD_LIBRARY_PATH', "$layerRoot/lib"
            }
            environmentVariable 'VK_LAYER_ENABLES', 'VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT'
            ideConfigGenerated false
        }
    }
}

