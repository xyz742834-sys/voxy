    //implementation 'org.rocksdb:rocksdbjni:8.10.0'
    //implementation 'redis.clients:jedis:5.1.0'

    // --- Vulkan backend tests ---
    // VkContext はサーフェスもウィンドウも持たないため、Minecraft を起動せずに
    // 素の JVM から Vulkan/MoltenVK を初期化できる (Phase 0 のベンチが実証済み)。
    // testImplementation / testRuntimeOnly は java プラグインの既定で
    // implementation / runtimeOnly を extendsFrom するので、lwjgl-vulkan と
    // shaderc の natives はそのまま引き継がれる。
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
