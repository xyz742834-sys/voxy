test {
    useJUnitPlatform()
    reports.junitXml.outputPerTestCase = true
    if (project.hasProperty('harnessOutput')) {
        reports.junitXml.outputLocation = file(project.property('harnessOutput') + '/junit')
        systemProperty('voxy.test.evidence', file(project.property('harnessOutput')).absolutePath)
    }
    // LWJGL 3.4 / JDK 25 では native アクセスに明示的な許可が要る
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    // Vulkan 系テストは MoltenVK natives がある macOS arm64 でのみ動く。
    // 他環境では VkContext を要するテストが自動的に skip される (VulkanTestSupport 参照)。
    systemProperty("voxy.test.os", System.getProperty("os.name") + "/" + System.getProperty("os.arch"))
    // LWJGL は既定で同梱の MoltenVK を直接ロードする (ローダーを経由しない)。
    // Khronos ローダー経由にすると explicit layer (バリデーション) が使えるようになる。
    //   ./gradlew test -PvkLibname=/opt/homebrew/lib/libvulkan.dylib
    if (project.hasProperty("vkLibname")) {
        systemProperty("org.lwjgl.vulkan.libname", project.property("vkLibname"))
    }
    // Lavapipe (Mesa の swrast Vulkan ICD、ソフトウェアラスタライザ) だけを
    // ローダーに見せる (Phase 6)。同期バリデーションが MoltenVK 上で機能しない
    // 問題の切り分けに使う — 同じテストを別 ICD 上で走らせて挙動を比べる。
    //   ./gradlew test -PvkLibname=/opt/homebrew/lib/libvulkan.dylib \
    //     -PvkIcd=/opt/homebrew/Cellar/mesa/26.2.2/share/vulkan/icd.d/lvp_icd.aarch64.json \
    //     -PvkValidation=true -PvkSyncEnv=true
    if (project.hasProperty("vkIcd")) {
        environment("VK_ICD_FILENAMES", project.property("vkIcd"))
    }
    if (project.hasProperty("vkValidation")) {
        systemProperty("voxy.vk.validation", project.property("vkValidation"))
        // brew の vulkan-validationlayers はマニフェストを Cellar 側に置くため、
        // ローダーに探索パスを教えないと見つからない (formula の caveats のとおり)。
        def layerRoot = "/opt/homebrew/opt/vulkan-validationlayers"
        def layerPath = "$layerRoot/share/vulkan/explicit_layer.d"
        if (file(layerPath).exists()) {
            environment("VK_LAYER_PATH", layerPath)
            // マニフェストの library_path が相対名 (libVkLayer_khronos_validation.dylib) なのに
            // 実体は ../lib にあるため、そのままではローダーが解決できず
            // VK_ERROR_LAYER_NOT_PRESENT (-6) になる。dylib の探索パスを足して解決させる。
            environment("DYLD_LIBRARY_PATH", "$layerRoot/lib")
            if (project.hasProperty("vkSyncEnv")) {
                environment("VK_LAYER_ENABLES", "VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT")
            }
        }
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = "full"
    }
}

// Phase 5a のベンチ。GL コンテキストを作るため JUnit では動かせない
// (GLFW は macOS で main スレッドを要求し、Gradle の test worker はそれを満たさない)。
// テスト本体 (155 件) は素の JVM のまま維持し、GL が要るものだけこちらに置く。
//
//   ./gradlew glToVkSyncBench
//   ./gradlew glToVkSyncBench --args="--loads 0,4,32 --iters 100"
def glVkTask = { String name, String mainClassName, String desc ->
    tasks.register(name, JavaExec) {
        group = "verification"
        description = desc
        classpath = sourceSets.test.runtimeClasspath
        mainClass = mainClassName
        jvmArgs("--enable-native-access=ALL-UNNAMED", "-XstartOnFirstThread")
        if (project.hasProperty("vkLibname")) {
            systemProperty("org.lwjgl.vulkan.libname", project.property("vkLibname"))
        }
        if (project.hasProperty("vkValidation")) {
            systemProperty("voxy.vk.validation", project.property("vkValidation"))
            def layerRoot = "/opt/homebrew/opt/vulkan-validationlayers"
            def layerPath = "$layerRoot/share/vulkan/explicit_layer.d"
            if (file(layerPath).exists()) {
                environment("VK_LAYER_PATH", layerPath)
                environment("DYLD_LIBRARY_PATH", "$layerRoot/lib")
            }
        }
    }
}

