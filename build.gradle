        }
    }

    dependencies {
        modRuntimeOnly('me.djtheredstoner:DevAuth-fabric:1.2.2') {
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }
}*/
// Phase 5c-1b / 5c-1c / 5c-1d の切り分け用スイッチ。再ビルドせずに 1 変数ずつ試せる。
//
//   ./gradlew runClient -Pvoxy5c1d=off       合成を完全に止める (5c-1a と同じ)
//   ./gradlew runClient -Pvoxy5c1d=state     FBO/ビューポートの控え・復帰だけ (描かない)
//   ./gradlew runClient -Pvoxy5c1d=pattern   5c-1b の非対称パターン (色経路だけの既知の正解)
//   ./gradlew runClient -Pvoxy5c1d=solid     テクスチャを読まずマゼンタ一色 (描画が届くかの診断)
//   ./gradlew runClient -Pvoxy5c1d=depth     5c-1c の深度可視化 (深度経路が生きているかの診断)
//   ./gradlew runClient -Pvoxy5c1d=terrain   合成地形を描いて合成する (既定)
//
// 各段のスイッチ名も残してある。**その段の "full" はその段の全経路**を指すので、
// 当時の手動確認をそのまま再現できる:
//   -Pvoxy5c1c=full -> depth      -Pvoxy5c1b=full -> pattern
tasks.named('runClient') {
    // Phase 5c-2b: 実際のブロックを焼いて使う (ワールドに入っていること)
    //   ./gradlew runClient -Pvoxy5c2=real
    if (project.hasProperty('voxy5c2')) {
        jvmArgs("-Dvoxy.5c2=" + project.property('voxy5c2'))
    }
    // 5c-3a: 自前の投影 + 深度再投影。
    //   ./gradlew runClient -Pvoxy5c3=off   3 組置くが **MC の投影のまま** (対照)
    //   ./gradlew runClient -Pvoxy5c3=on    自前の投影 + 再投影 (本命)
    // どちらでも 3 つ目は MC の far 平面の外に置かれる。off で 3 つ目が見えたら
    // 「置き場所が far 平面の外になっていない」ということで、対照が空虚である。
    if (project.hasProperty('voxy5c3')) {
        jvmArgs("-Dvoxy.5c3=" + project.property('voxy5c3'))
    }
    // ⚠ **1 組だけ描く**。3 組は見た目が同じなので、目で当てさせない
    //   ./gradlew runClient -Pvoxy5c3=on  -Pvoxy5c3Only=beyond   -> drawn > 0 でなければならない
    //   ./gradlew runClient -Pvoxy5c3=off -Pvoxy5c3Only=beyond   -> drawn = 0 でなければならない
    // 5c-3b: 実ジオメトリ。半径 (既定 4) のセクションを LoD 0 でメッシュ化する。
    //   ./gradlew runClient -Pvoxy5c3b=on     半径 4
    //   ./gradlew runClient -Pvoxy5c3b=2      半径 2 (狭く)
    //   -Pvoxy5c3bRealColours=true            実テクスチャで描く (既定は id 由来の合成色)
    //   -Pvoxy5c3bQuads=4000000               ジオメトリバッファを広げる
    // 5c-4c: 実データの階層トラバーサル。**Voxy の本質が初めて動く**
    //   ./gradlew runClient -Pvoxy5c4=on
    //   -Pvoxy5c4Radius=1        最上位ノードの半径 (MAX_LOD_LAYER の粒度、既定 1 = 3x3x3)
    //   -Pvoxy5c4Depth=2         最上位から何段下までメッシュ化するか
    //   -Pvoxy5c4Subdivision=128 降下の閾値 (画素の一辺)。小さいほど深く降りる
    //   -Pvoxy5c4Distance=-1     描画距離 (ブロック)。負なら無制限
    //   -Pvoxy5c4Sections=20000  描画キューと密テーブルの容量
    if (project.hasProperty('voxy5c4')) {
        jvmArgs("-Dvoxy.5c4=" + project.property('voxy5c4'))
    }
    //   -Pvoxy5c4Projection=false  自前投影を切る (対照。MC の投影で描く)
    ['Radius': 'radius', 'Depth': 'depth', 'Subdivision': 'subdivision',
     'Distance': 'distance', 'Sections': 'sections', 'Projection': 'projection',
     'MeshesPerFrame': 'meshesPerFrame',
     // ⚠ 階層経路のジオメトリ容量 (quad)。5c-3b とは別。NodeCleaner が無いので減らない
     'Quads': 'quads',
     // ⚠ 内訳と footprint の間隔 (フレーム)。1 にすると毎フレーム — 連続で比べられる
     'Interval': 'interval',
     // ⚠ 切り分け用: クリア色をフレームごとに動かす (既定 true)
     'Clearsweep': 'clearsweep'].each { k, v ->
        def prop = 'voxy5c4' + k
        if (project.hasProperty(prop)) {
            jvmArgs("-Dvoxy.5c4." + v + "=" + project.property(prop))
        }
    }
    // 5c-5a: temporal パスを実データで戻す。**可視の書き方が temporal を決める**
    //   ./gradlew runClient -Pvoxy5c4=on                  既定 = cull (本番経路)
    //   ./gradlew runClient -Pvoxy5c4=on -Pvoxy5c5=cull   カルパスが可視を書く (本番経路)
    //   ./gradlew runClient -Pvoxy5c4=on -Pvoxy5c5=all    全て前フレーム可視 -> temporal は空
    //   ./gradlew runClient -Pvoxy5c4=on -Pvoxy5c5=none   全て新規可視     -> temporal == 不透明
    //   ./gradlew runClient -Pvoxy5c4=on -Pvoxy5c5=even   偶数 id だけ新規 -> 真部分集合
    //   ./gradlew runClient -Pvoxy5c4=on -Pvoxy5c5=odd    奇数 id だけ新規 -> even との和が全体
    //   ./gradlew runClient -Pvoxy5c4=on -Pvoxy5c5=cycle  上の 4 つを順に回して分割の恒等式を見る
    // ⚠ 片方だけでは駄目である。「空」だけを見ると「常に空」が通り、
    //   「一致」だけを見ると「常に不透明と同じ」が通る (5c-1e と同じ型)
    // Phase 6 第二項目: 深度境界の掃引。opaque のうち断片処理が占める割合を測る
    //   ./gradlew runClient -Pvoxy5c4=on -Pvoxy6Bound=sweep
    //   -Pvoxy6BoundFrames=120   1 つの値を保つフレーム数
    if (project.hasProperty('voxy6Bound')) {
        jvmArgs("-Dvoxy.6.bound=" + project.property('voxy6Bound'))
    }
    if (project.hasProperty('voxy6BoundFrames')) {
        jvmArgs("-Dvoxy.6.boundFrames=" + project.property('voxy6BoundFrames'))
    }
    if (project.hasProperty('voxy5c5')) {
        jvmArgs("-Dvoxy.5c5=" + project.property('voxy5c5'))
    }
    //   -Pvoxy5c5Frames=30  cycle のとき 1 モードを何フレーム保つか
    if (project.hasProperty('voxy5c5Frames')) {
        jvmArgs("-Dvoxy.5c5.frames=" + project.property('voxy5c5Frames'))
    }
    if (project.hasProperty('voxy5c3b')) {
        jvmArgs("-Dvoxy.5c3b=" + project.property('voxy5c3b'))
    }
    if (project.hasProperty('voxy5c3bRealColours')) {
        jvmArgs("-Dvoxy.5c3b.realColours=" + project.property('voxy5c3bRealColours'))
    }
    // ⚠ MC も同じ場所を描いているので、深度を見ると当然ちらつく。
    //   Voxy の絵だけを見たいとき:
    //   ./gradlew runClient -Pvoxy5c3b=on -Pvoxy5c3bOnly=true
    if (project.hasProperty('voxy5c3bOnly')) {
        jvmArgs("-Dvoxy.5c3b.only=" + project.property('voxy5c3bOnly'))
    }
    if (project.hasProperty('voxy5c3bQuads')) {
        jvmArgs("-Dvoxy.5c3b.quads=" + project.property('voxy5c3bQuads'))
    }
    if (project.hasProperty('voxy5c3Only')) {
        jvmArgs("-Dvoxy.5c3.only=" + project.property('voxy5c3Only'))
    }
    if (project.hasProperty('voxy5c3Factor')) {
        jvmArgs("-Dvoxy.5c3.factor=" + project.property('voxy5c3Factor'))
    }
    if (project.hasProperty('voxy5c1e')) {
        jvmArgs("-Dvoxy.5c1e=" + project.property('voxy5c1e'))
    }
    // 5c-1e の置き場所 (ブロック)。奥の組が far 平面で切られるときに詰める
    ['near', 'far', 'lateral'].each { k ->
        def prop = 'voxy5c1e' + k.capitalize()
        if (project.hasProperty(prop)) {
            jvmArgs("-Dvoxy.5c1e." + k + "=" + project.property(prop))
        }
    }
    if (project.hasProperty('voxy5c1d')) {
        jvmArgs("-Dvoxy.5c1d=" + project.property('voxy5c1d'))
    }
    if (project.hasProperty('voxy5c1c')) {
        jvmArgs("-Dvoxy.5c1c=" + project.property('voxy5c1c'))
    }
    if (project.hasProperty('voxy5c1b')) {
        jvmArgs("-Dvoxy.5c1b=" + project.property('voxy5c1b'))
    }
}
